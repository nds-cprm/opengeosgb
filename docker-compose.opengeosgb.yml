x-common:
  &default-common
  platform: linux/amd64

x-common-django:
  &default-common-django
  <<: *default-common
  image: ${DOCKER_NAMESPACE:-$COMPOSE_PROJECT_NAME}/geonode:${GEONODE_BASE_IMAGE_VERSION}-rootless
  volumes:
    - './src:/usr/src/project'
    - statics:/mnt/volumes/statics
    # - /home/mota/_geonode/statics:/mnt/volumes/statics
    - geoserver-data-dir:/geoserver_data/data
    # - backup-restore:/backup_restore
    - ./draft/br:/backup_restore
    - data:/data
    # - /home/mota/_geonode/data:/data
    - tmp:/tmp
  # UID arbitrário com grupo 0: as imagens dão aos diretórios graváveis g=u
  user: '1000:0'

services:
  django:
    << : *default-common-django
    # TARGETPLATFORM: usado no FROM --platform dos Dockerfiles. O podman compose (via
    # docker-compose) não repassa o "platform" do serviço ao builder; sem este arg, a
    # imagem base sai na arquitetura do host. No buildx, cada plataforma já o define.
    build:
      args:
        - TARGETPLATFORM=linux/amd64
    ports:
      - 8000:8000

  celery:
    << : *default-common-django

  geonode:
    <<: *default-common
    image: ${DOCKER_NAMESPACE:-$COMPOSE_PROJECT_NAME}/nginx:${NGINX_BASE_IMAGE_VERSION}-geonode
    # user: '1000'
    build:
      context: ./docker/docker/nginx
      dockerfile: Dockerfile
      args:
        - NGINX_VERSION=${NGINX_BASE_IMAGE_VERSION}
        - TARGETPLATFORM=linux/amd64
    # bind to container ports of 8080 and 8443 because of use of nginx-unprivileged 
    ports:
      - "${HTTP_PORT}:8080"
      - "${HTTPS_PORT}:8443"
    environment:
      - RESOLVER=${RESOLVER}
    volumes:
      # - nginx-confd:/etc/nginx
      - nginx-certificates:/geonode-certificates
      - statics:/mnt/volumes/statics
      # - /home/mota/_geonode/statics:/mnt/volumes/statics

  letsencrypt:
    <<: *default-common
    image: ${DOCKER_NAMESPACE:-$COMPOSE_PROJECT_NAME}/letsencrypt:${LETSENCRYPT_BASE_IMAGE_VERSION}
    build:
      context: ./docker/docker/letsencrypt
      args:
        - TARGETPLATFORM=linux/amd64
    deploy:
      # mode explícito: o podman-compose só respeita "replicas" quando mode é "replicated"
      mode: replicated
      replicas: 0

  geoserver:
    <<: *default-common
    image: ${DOCKER_NAMESPACE:-$COMPOSE_PROJECT_NAME}/geoserver:${GEOSERVER_BASE_IMAGE_VERSION}-geonode
    build:
      context: ./docker/docker/geoserver
      dockerfile: Dockerfile
      args:
        - GEOSERVER_VERSION=${GEOSERVER_BASE_IMAGE_VERSION}
        - IMAGE_VERSION=9.0.107-jdk11-temurin-jammy
        - TARGETPLATFORM=linux/amd64
    volumes:
      - statics:/mnt/volumes/statics
      # - /home/mota/_geonode/statics:/mnt/volumes/statics
      - geoserver-data-dir:/geoserver_data/data
      # - backup-restore:/backup_restore
      - ./draft/br:/backup_restore
      - data:/data
      # - /home/mota/_geonode/data:/data
      - tmp:/tmp
    environment:
      - PROXY_BASE_URL=${NGINX_BASE_URL}/geoserver
      # no Podman o HOME de um UID sem passwd vira o WORKDIR (/usr/local/tomcat/tmp,
      # do root) e o entrypoint não consegue criar o .bashrc
      - HOME=/tmp
    ports:
      - "8080:8080"
    user: '1000:0'

  data-dir-conf:
    <<: *default-common
    image: ${DOCKER_NAMESPACE:-$COMPOSE_PROJECT_NAME}/geoserver_data:${GEOSERVER_BASE_IMAGE_VERSION}-geonode
    # user: '1000'
    build:
      context: ./docker/docker/geoserver_data
      dockerfile: Dockerfile
      args:
        - GEOSERVER_VERSION=${GEOSERVER_BASE_IMAGE_VERSION}
        - TARGETPLATFORM=linux/amd64

  db:
    <<: *default-common
    image: ${DOCKER_NAMESPACE:-$COMPOSE_PROJECT_NAME}/postgis:${POSTGRES_BASE_IMAGE_VERSION}-geonode
    build:
      context: ./docker/docker/postgis
      args:
        - POSTGRES_BASE_IMAGE_VERSION=${POSTGRES_BASE_IMAGE_VERSION}
        - TARGETPLATFORM=linux/amd64
    volumes:
      - dbdata:/var/lib/postgresql/data
      # - /home/mota/_geonode/dbdata:/var/lib/postgresql/data
      - dbbackups:/pg_backups
    ports:
     - "5432:5432"

  mailserver:
    image: python:3.11-alpine
    container_name: mailserver4${COMPOSE_PROJECT_NAME}
    command: >
      sh -c "python -m smtpd -d -c DebuggingServer -n 0.0.0.0:1025"
    ports:
      - "1025:1025"