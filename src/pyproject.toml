[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "OpenGeoSGB"
# Igual à tag git da release, sem o "v" (política em "Versões e imagens publicadas" no README). O workflow
# "Imagem Docker" falha numa tag vX.Y.Z se esta versão for diferente.
version = "1.0.0"
description = "OpenGeoSGB"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
keywords = ["OpenGeoSGB", "geonode", "django"]

# Equivalent modern replacement for dependency_links:
dependencies = [
  # "GeoNode @ git+https://github.com/GeoNode/geonode.git@5.0.3"
]

[project.urls]
Homepage = "https://github.com/nds-cprm/opengeosgb"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
# Equivalent to find_packages()
where = ["."]
