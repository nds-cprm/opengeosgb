{% extends 'geonode-mapstore-client/_geonode_config.html' %}
{% load get_menu_json %}
{% block override_local_config %}
<script>
    window.__GEONODE_CONFIG__.overrideLocalConfig = function(localConfig, _) {
        // Here the localConfig can be overridden and/or extended

        // Datas em formato numérico de acordo com o idioma (moment): "L" = data do idioma
        // (06/11/2026 em pt, 11/06/2026 em en) + hora 24h, sem texto (ex.: sem "PM" ou nome do mês)
        var DATE_FORMAT = 'L HH:mm';

        // Abas padrão do painel de propriedades (ResourceDetails) do geonode-mapstore-client 5.0.3,
        // copiadas de resource-details-plugin.*.chunk.js: o plugin não mescla configuração parcial,
        // então, para mudar o formato das datas, é preciso fornecer as abas completas.
        // Ao atualizar o client, compare com o padrão da nova versão.
        var DEFAULT_RESOURCE_DETAILS_TABS = {% include "opengeosgb/resource_details_tabs.json" %};

        function setDateFormats(node) {
            if (Array.isArray(node)) {
                node.forEach(setDateFormats);
            } else if (node && typeof node === 'object') {
                if (node.type === 'date' && node.format) {
                    node.format = DATE_FORMAT;
                }
                Object.keys(node).forEach(function(key) {
                    setDateFormats(node[key]);
                });
            }
        }

        // Linha "Escala" na aba de informações, depois de "Regiões"; só aparece se o recurso tiver
        // escala (campo esparso "scale", incluído na API pelo preset viewer_common - ver apps.py)
        var SCALE_ITEM = {
            type: 'text',
            labelId: 'opengeosgb.scale',
            value: "{get(state('gnResourceData'), 'scale.label')}",
            disableIf: "{not get(state('gnResourceData'), 'scale.label')}"
        };

        function addScaleItem(tabs) {
            var info = (Array.isArray(tabs) ? tabs : []).filter(function(tab) { return tab && tab.id === 'info'; })[0];
            if (!info || !Array.isArray(info.items) || info.items.some(function(item) { return item && item.labelId === SCALE_ITEM.labelId; })) {
                return;
            }
            var regions = info.items.findIndex(function(item) { return item && item.labelId === 'gnviewer.regions'; });
            info.items.splice(regions >= 0 ? regions + 1 : info.items.length, 0, Object.assign({}, SCALE_ITEM));
        }

        var pages = (localConfig && localConfig.plugins) || {};
        Object.keys(pages).forEach(function(page) {
            if (!Array.isArray(pages[page])) {
                return;
            }
            pages[page] = pages[page].map(function(plugin) {
                // plugins declarados só pelo nome viram objeto para receber configuração
                if (plugin === 'ResourceDetails') {
                    plugin = {name: 'ResourceDetails'};
                }
                if (!plugin || typeof plugin !== 'object') {
                    return plugin;
                }
                var cfg = plugin.cfg || {};

                // Colunas da visualização em lista do catálogo: o localConfig do client lê o campo
                // "description", que não existe na API de recursos do GeoNode; a descrição vem em
                // "abstract" (HTML) e "raw_abstract" (texto puro). Datas no formato numérico.
                var listColumns = cfg.metadata && cfg.metadata.list;
                (Array.isArray(listColumns) ? listColumns : []).forEach(function(column) {
                    if (column && column.path === 'description') {
                        column.path = 'raw_abstract';
                    }
                });
                setDateFormats(listColumns);

                // Painel de propriedades: abas padrão (quando não configuradas) e datas no formato numérico
                if (plugin.name === 'ResourceDetails' && !cfg.tabs) {
                    cfg.tabs = JSON.parse(JSON.stringify(DEFAULT_RESOURCE_DETAILS_TABS));
                }
                setDateFormats(cfg.tabs);
                if (plugin.name === 'ResourceDetails') {
                    addScaleItem(cfg.tabs);
                }

                // Barra de filtros: filtro por escala depois do de regiões (facet "scale" da API de
                // facets, fornecida por opengeosgb.metadata.facets.ScaleFacetProvider)
                if (Array.isArray(cfg.fields)) {
                    var place = cfg.fields.findIndex(function(field) { return field && field.facet === 'place'; });
                    var hasScale = cfg.fields.some(function(field) { return field && field.facet === 'scale'; });
                    if (place >= 0 && !hasScale) {
                        cfg.fields.splice(place + 1, 0, {type: 'select', facet: 'scale'});
                    }
                }

                plugin.cfg = cfg;
                return plugin;
            });
        });

        return localConfig;
    };
</script>
<!-- 
   Seção "Serviços legados do GeoSGB" na home, com os itens do placeholder GEOSGB_MENU (próprio do opengeosgb, para não
   colidir com placeholders do GeoNode/MapStore, como o CARDS_MENU que o client 5.0.x não lê mais). CSS em
   opengeosgb.css (.gn-geosgb-menu*) 
-->
{% get_menu_json 'GEOSGB_MENU' as GEOSGB_MENU %}
{{ GEOSGB_MENU|json_script:"menu-GEOSGB_MENU" }}
<script>
    (function() {
        var SECTION_ID = 'gn-geosgb-menu-section';
        var SECTION_TITLE = 'Serviços legados do GeoSGB';

        function readItems() {
            try {
                var node = document.getElementById('menu-GEOSGB_MENU');
                var items = node && JSON.parse(node.textContent);
                return Array.isArray(items) ? items : [];
            } catch (e) {
                return [];
            }
        }

        function safeHref(href) {
            return /^\s*javascript:/i.test(href || '') ? '#' : (href || '#');
        }

        function link(item, className) {
            var a = document.createElement('a');
            a.href = safeHref(item.href);
            a.textContent = item.label || '';
            if (className) { a.className = className; }
            if (item.target === '_blank') {
                a.target = '_blank';
                a.rel = 'noopener noreferrer';
            } else {
                // links que abrem na mesma aba usam o estado "active" (negrito + sublinhado)
                a.classList.add('active');
            }
            return a;
        }

        function el(tag, className) {
            var node = document.createElement(tag);
            if (className) { node.className = className; }
            return node;
        }

        function buildInline(items) {
            var ul = el('ul', 'gn-geosgb-menu-inline');
            items.forEach(function(item) {
                var li = el('li');
                if (item.type === 'dropdown') {
                    li.className = 'dropdown';
                    var btn = el('button', 'btn btn-default dropdown-toggle');
                    btn.type = 'button';
                    btn.setAttribute('data-toggle', 'dropdown');
                    btn.setAttribute('aria-haspopup', 'true');
                    btn.appendChild(document.createTextNode((item.label || '') + ' '));
                    btn.appendChild(el('span', 'caret'));
                    var menu = el('ul', 'dropdown-menu');
                    (item.items || []).forEach(function(child) {
                        var cli = el('li');
                        cli.appendChild(link(child));
                        menu.appendChild(cli);
                    });
                    li.appendChild(btn);
                    li.appendChild(menu);
                } else {
                    li.appendChild(link(item, 'btn btn-default'));
                }
                ul.appendChild(li);
            });
            return ul;
        }

        function buildCompact(items) {
            var wrapper = el('div', 'dropdown gn-geosgb-menu-compact');
            var btn = el('button', 'btn btn-default dropdown-toggle');
            btn.type = 'button';
            btn.setAttribute('data-toggle', 'dropdown');
            btn.setAttribute('aria-haspopup', 'true');
            btn.setAttribute('aria-label', 'Menu');
            btn.appendChild(el('i', 'fa fa-bars'));
            var menu = el('ul', 'dropdown-menu');

            function divider() {
                var li = el('li', 'divider');
                li.setAttribute('role', 'separator');
                menu.appendChild(li);
            }

            items.forEach(function(item) {
                if (item.type === 'dropdown') {
                    divider();
                    var header = el('li');
                    var title = el('span', 'dropdown-submenu-title');
                    title.textContent = item.label || '';
                    header.appendChild(title);
                    menu.appendChild(header);
                    divider();
                    (item.items || []).forEach(function(child) {
                        var cli = el('li');
                        cli.appendChild(link(child));
                        menu.appendChild(cli);
                    });
                    divider();
                } else {
                    var li = el('li');
                    li.appendChild(link(item));
                    menu.appendChild(li);
                }
            });
            wrapper.appendChild(btn);
            wrapper.appendChild(menu);
            return wrapper;
        }

        function buildSection(items) {
            // espelha o markup das grades da home: .ms-resources-container > div._relative._margin-auto,
            // com o título no mesmo estilo do cabeçalho (.ms-resources-menu: _padding-tb-sm + fonte lg)
            var section = el('section', 'ms-resources-container ms-main-colors _padding-lr-md gn-geosgb-menu-section');
            section.id = SECTION_ID;
            var inner = el('div', '_relative _margin-auto');
            var header = el('div', '_padding-tb-sm');
            var title = el('div', 'ms-text _font-size-lg');
            title.textContent = SECTION_TITLE;
            header.appendChild(title);
            var bar = el('div', 'gn-geosgb-menu _padding-tb-sm');
            bar.appendChild(buildInline(items));
            bar.appendChild(buildCompact(items));
            inner.appendChild(header);
            inner.appendChild(bar);
            section.appendChild(inner);
            return section;
        }

        function mount() {
            var items = readItems();
            // só na página inicial: entre os destaques e a grade "todos os recursos"
            var allResources = document.getElementById('gn-home-resources-grid');
            if (!items.length || !allResources || !allResources.parentNode || document.getElementById(SECTION_ID)) {
                return;
            }
            allResources.parentNode.insertBefore(buildSection(items), allResources);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', mount);
        } else {
            mount();
        }
    })();
</script>
{% endblock %}
